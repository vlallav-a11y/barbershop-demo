<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2efe8">
  <title>BRUT — barbershop</title>
  <link rel="stylesheet" href="./styles.css?v=full-redesign-1">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="site">
    <header class="header">
      <button id="logoButton" class="logo-button" type="button">
        <span class="logo-mark">B</span>
        <span class="logo-copy">
          <strong>BRUT</strong>
          <small>BARBERSHOP</small>
        </span>
      </button>

      <div class="header-actions">
        <button id="myBookingsButton" class="header-link" type="button">Мои записи</button>
        <button id="ownerModeBtn" class="owner-switch" type="button">Владелец</button>
      </div>
    </header>

    <main id="main"></main>

    <button id="floatingBookButton" class="floating-book" type="button">
      <span>Записаться</span>
      <strong>→</strong>
    </button>
  </div>

  <div id="bookingOverlay" class="overlay hidden">
    <div class="overlay-panel">
      <div class="overlay-head">
        <button id="overlayBack" class="icon-button hidden" type="button">←</button>
        <div>
          <span id="overlayEyebrow">ОНЛАЙН-ЗАПИСЬ</span>
          <h2 id="overlayTitle">Выберите услугу</h2>
        </div>
        <button id="closeOverlay" class="icon-button" type="button">×</button>
      </div>

      <div id="bookingProgress" class="progress"></div>
      <div id="bookingContent" class="overlay-content"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="./app.js?v=full-redesign-1"></script>
</body>
</html>
